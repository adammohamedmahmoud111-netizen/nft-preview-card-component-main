<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="nft-preview-card-component-main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <title>nft-preview-card-component-main</title>
</head>

<body>
    <div class="background">
        <div class="container">
            <div class="image-container">
                <div class="image"><img src="images/image-equilibrium.jpg" alt="#" class="main-image"></div>
                <div class="overlay">
                    <img src="images/icon-view.svg" alt="view icon" class="view-icon">
                </div>
            </div>
            <div class="descreption">
                <h2>Equilibrium #3429</h2>
                <p>Our Equilibrium collection promotes
                    balance and calm.</p>
            </div>
            <div class="points">
                <div class="point-right"><img src="images/icon-ethereum.svg" alt="#">
                    <p>0.041 ETH</p>
                </div>
                <div class="timer"><img src="images/icon-clock.svg" alt="#">
                    <p>3 days left</p>
                </div>
            </div>
            <div class="avatar"><img src="images/image-avatar.png" alt="#">
                <p>Creation of <span>Jules Wyvern</span></p>
            </div>
        </div>
    </div>
</body>

</html>
